<!TEMPLATE /cardpage.html>
<head>
    <title>Clock Calibration Helper</title>
</head>
<body>
    <canvas id="view" style="width: 100%; height: 360px;"></canvas>
    <input id="threshhold" type="range" min="0.0000" max="1.0000" step="0.0001">
    <input id="threshhold-typed" type="number" min="0.0000" max="1.0000" step="0.0001">
    <span id="avg-vol"></span>
    <script>
        const avgVolume = document.getElementById('avg-vol');
        window.onerror = e => avgVolume.innerText = e;        
        
        const view = document.getElementById('view');
        /** @type {CanvasRenderingContext2D} */
        const ctx = view.getContext('2d');

        const threshhold = document.getElementById('threshhold');
        const threshTyped = document.getElementById('threshhold-typed');
        threshhold.onchange = () => threshTyped.value = thresh = threshhold.value;
        threshTyped.onchange = () => threshhold.value = thresh = threshTyped.value;
        const avg = [];
        const max = 100;
        let thresh = threshhold.value;
        let t = 0;
        let x = 0;
        let y = 0;
        navigator.mediaDevices
            .getUserMedia({ audio: true, video: false })
            .then(stream => {
                const context = new AudioContext();
                const latchTime = context.sampleRate * 0.02;
                const coolOff = context.sampleRate * 0.2;
                let coolDown = -1;
                let latchedTil = -1;
                view.height = context.sampleRate;
                view.width = 100;
                const src = context.createMediaStreamSource(stream);
                const node = context.createScriptProcessor();
                node.onaudioprocess = e => {
                    const total = e.inputBuffer.getChannelData(0);
                    for (let i = 1; i < e.inputBuffer.numberOfChannels; i++) {
                        const data = e.inputBuffer.getChannelData(i);
                        for (let j = 0; j < data.length; j++)
                            total[j] += data[j];
                    }
                    for (let i = 0; i < total.length; i++) {
                        total[i] /= e.inputBuffer.numberOfChannels;
                        avg.push(total[i]);
                        if (avg.length > max) avg.shift();
                        if (Math.abs(total[i] / 2) > thresh && t > coolDown) {
                            latchedTil = t + latchTime;
                            coolDown = t + coolOff;
                        }
                        if (t < latchedTil) ctx.fillStyle = '#000000';
                        else ctx.fillStyle = '#FFFFFF';
                        if (++y >= view.height) { y = 0; x++; }
                        if (x > view.width) x = 0;
                        ctx.fillRect(x,y, 1,1);
                        t++;
                    }
                    avgVolume.innerText = avg.reduce((c,v) => c + v, 0) / avg.length;
                }
                src.connect(node);
                node.connect(context.destination);
            });
    </script>
</body>
