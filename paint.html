    <script>
        const authorized = !!performance.getEntriesByType('navigation')[0].serverTiming.find(v => v.name === 'authorized');

        const elementClassNames = {
            "a": 'HTMLAnchorElement',
            "area": 'HTMLAreaElement',
            "audio": 'HTMLAudioElement',
            "base": 'HTMLBaseElement',
            "blockquote": 'HTMLQuoteElement',
            "body": 'HTMLBodyElement',
            "br": 'HTMLBRElement',
            "button": 'HTMLButtonElement',
            "canvas": 'HTMLCanvasElement',
            "caption": 'HTMLTableCaptionElement',
            "col": 'HTMLTableColElement',
            "colgroup": 'HTMLTableColElement',
            "data": 'HTMLDataElement',
            "datalist": 'HTMLDataListElement',
            "del": 'HTMLModElement',
            "details": 'HTMLDetailsElement',
            "dialog": 'HTMLDialogElement',
            "dir": 'HTMLDirectoryElement',
            "div": 'HTMLDivElement',
            "dl": 'HTMLDListElement',
            "embed": 'HTMLEmbedElement',
            "fencedframe": 'HTMLUnknownElement',
            "fieldset": 'HTMLFieldSetElement',
            "font": 'HTMLFontElement',
            "form": 'HTMLFormElement',
            "frame": 'HTMLFrameElement',
            "frameset": 'HTMLFrameSetElement',
            "h1": 'HTMLHeadingElement',
            "head": 'HTMLHeadElement',
            "hr": 'HTMLHRElement',
            "html": 'HTMLHtmlElement',
            "iframe": 'HTMLIFrameElement',
            "img": 'HTMLImageElement',
            "input": 'HTMLInputElement',
            "ins": 'HTMLModElement',
            "label": 'HTMLLabelElement',
            "legend": 'HTMLLegendElement',
            "li": 'HTMLLIElement',
            "link": 'HTMLLinkElement',
            "map": 'HTMLMapElement',
            "marquee": 'HTMLMarqueeElement',
            "menu": 'HTMLMenuElement',
            "meta": 'HTMLMetaElement',
            "meter": 'HTMLMeterElement',
            "object": 'HTMLObjectElement',
            "ol": 'HTMLOListElement',
            "optgroup": 'HTMLOptGroupElement',
            "option": 'HTMLOptionElement',
            "output": 'HTMLOutputElement',
            "p": 'HTMLParagraphElement',
            "param": 'HTMLParamElement',
            "picture": 'HTMLPictureElement',
            "portal": 'HTMLUnknownElement',
            "pre": 'HTMLPreElement',
            "progress": 'HTMLProgressElement',
            "q": 'HTMLQuoteElement',
            "script": 'HTMLScriptElement',
            "select": 'HTMLSelectElement',
            "slot": 'HTMLSlotElement',
            "source": 'HTMLSourceElement',
            "span": 'HTMLSpanElement',
            "style": 'HTMLStyleElement',
            "table": 'HTMLTableElement',
            "tbody": 'HTMLTableSectionElement',
            "td": 'HTMLTableCellElement',
            "template": 'HTMLTemplateElement',
            "textarea": 'HTMLTextAreaElement',
            "tfoot": 'HTMLTableSectionElement',
            "th": 'HTMLTableCellElement',
            "thead": 'HTMLTableSectionElement',
            "time": 'HTMLTimeElement',
            "title": 'HTMLTitleElement',
            "tr": 'HTMLTableRowElement',
            "track": 'HTMLTrackElement',
            "ul": 'HTMLUListElement',
            "video": 'HTMLVideoElement',
            "xmp": 'HTMLPreElement'
        };
        // loose def for elements that dont require any direct manipulation
        function defineElement(name, attributes, innerGen) {
            const extend = attributes.extends;
            /** @type {HTMLElement} */
            const elClass = window[elementClassNames[extend]] ?? HTMLElement;
            let onAttributes;
            class newElement extends elClass {
                static observedAttributes = Object.keys(attributes)
                    .filter(key => !key.startsWith('on') && !['extends', 'attributes'].includes(key));
                display = null;
                priv = {};
                constructor() {
                    if (extend) 
                        return document.createElement(extend, { is: name });
                    super();
                    if (!this.display) this.display = this.attachShadow({ mode: 'open' });
                    innerGen.apply(this, [this.display]);
                    for (const [key, val] of Object.entries(attributes)) {
                        if (key.startsWith('on')) {
                            this.addEventListener(key.slice(2), val.bind(this));
                            continue;
                        }
                        this.setAttribute(key, val);
                    }
                }
                attributeChangedCallback(key, oldVal, newVal) {
                    onAttributes?.apply?.(this, [key, oldVal, newVal]);
                    if (key in newElement.prototype) return;
                    this[key] = newVal;
                }
            }
            for (const key in attributes) {
                if (key.startsWith('on')) {
                    switch (key.slice(3)) {
                    case 'connected':
                        newElement.prototype.connectedCallback = attributes[key];
                        delete attributes[key];
                        break;
                    case 'disconnected':
                        newElement.prototype.disconnectedCallback = attributes[key];
                        delete attributes[key];
                        break;
                    case 'adopted':
                        newElement.prototype.adoptedCallback = attributes[key];
                        delete attributes[key];
                        break;
                    case 'attributes':
                        onAttributes = attributes[key];
                        delete attributes[key];
                        break;
                    }
                    continue;
                }
            }
            if (attributes.attributes) {
                newElement.observedAttributes = attributes.attributes;
                delete attributes.attributes;
            }
            if (attributes.this) {
                Object.assign(newElement.prototype, attributes.this);
                delete attributes.this;
            }
            delete attributes.extends;
            customElements.define(name, newElement, { extends: attributes.extends });
            return newElement;
        }
        function appendChildren(parent, children) {
            children.forEach(child => {
                if (!child) return;
                if (Array.isArray(child))
                    return appendChildren(parent, child);

                try { parent.appendChild(child); }
                catch (e) {
                    parent.appendChild(document.createTextNode(String(child)));
                }
            });
        }
        /** @param {HTMLElement} el */
        function setAttribute(el, key, val) {
            if (val) el.setAttribute(key, typeof val === 'object' ? JSON.stringify(val) : val);
            else el.removeAttribute(key);
        }
    </script>
    <style>

        .controls * { display: none; }
        .controls.expanded * { display: inherit; }

            border-top: 0;

        .popunder {

        .color-slider {

    <script file="jsx">
        const colorHistory = document.getElementById('color-history');
        const pickColor = document.getElementById('pick-color');
        pickColor.onclick = () => {
            currentTool = 'color-picker';
            zoomViewer.hidden = false;
            colorPicker.hidePopover();
        }

        const stopCount = 8;
        const colorPicker = document.getElementById('color-picker');
        const sliders = [];
        let targetSwatch;
        const currentColor = () => `oklab(${l.get()}% ${a.get()}% ${b.get()}% / ${A.get()}%)`;
        function updateColor() {
            for (const { stopper, sliderGradient, min, max } of sliders) {
                let gradient = 'linear-gradient(to right'
                for (let i = 0; i < stopCount; i++) {
                    const v = min + ((i / (stopCount -1)) * (max - min));
                    const p = (i / (stopCount -1)) * 100;
                    gradient += `, ${stopper(v)} calc(${p}% - 4px)`;
                }
                gradient += ')';
                sliderGradient.style.backgroundImage = gradient;
            }

            if (!targetSwatch) return;
            targetSwatch.style.backgroundColor = currentColor();
        }
        function createColorSlider(min = 0, max = 100, value = 100, stopper = () => '') {
            const sliderGradient = <div class="gradient"></div>;
            const sliderHandle = <div class="highlight"></div>;
            /** @type {HTMLDivElement} */
            const sliderBody = <div class="color-slider">{sliderGradient}{sliderHandle}</div>;

            const rect = sliderBody.getBoundingClientRect();
            const x = (rect.width -4) * ((value - min) / (max - min));
            sliderHandle.style.left = `${x}px`;

            sliders.push({ stopper, sliderGradient, sliderHandle, min, max, value });
            let held = false;
            sliderHandle.ontouchstart =
            sliderHandle.onmousedown = () => held = true;
            const mouseMove = e => {
                if (!held) return;
                if (e.changedTouches) e = e.changedTouches.item(0);
                const rect = sliderBody.getBoundingClientRect();
                const x = Math.min(Math.max((e.clientX - rect.left) -2, 0), rect.width -4);
                sliderHandle.style.left = `${x}px`;
                updateColor();
            }
            document.addEventListener('mousemove', mouseMove);
            document.addEventListener('touchmove', mouseMove);
            document.addEventListener('touchend', () => held = false);
            document.addEventListener('mouseup', () => held = false);
            colorPicker.prepend(sliderBody);
            
            return {
                get() {
                    const rect = sliderBody.getBoundingClientRect();
                    const x = Number(sliderHandle.style.left.slice(0, -2));
                    return min + ((x / (rect.width -4)) * (max - min));
                },
                set(v) {
                    if (isNaN(v)) v = value;
                    const rect = sliderBody.getBoundingClientRect();
                    const x = (rect.width -4) * ((v - min) / (max - min));
                    sliderHandle.style.left = `${x}px`; 
                    updateColor();
                }
            }
        }

        const A = createColorSlider(0, 100, 100, v => `oklab(${l.get()}% ${a.get()}% ${b.get()}% / ${v}%)`);
        const b = createColorSlider(-100, 100, 0, v => `oklab(${l.get()}% ${a.get()}% ${v}% / ${A.get()}%)`);
        const a = createColorSlider(-100, 100, 0, v => `oklab(${l.get()}% ${v}% ${b.get()}% / ${A.get()}%)`);
        const l = createColorSlider(0, 100, 100, v => `oklab(${v}% ${a.get()}% ${b.get()}% / ${A.get()}%)`);

        colorPicker.onbeforetoggle = e => {
            if (!e.source?.firstElementChild) return;
            targetSwatch = e.source?.firstElementChild;
        }
        colorPicker.ontoggle = e => {
            if (e.newState === 'closed') {
                pickColor.after(<div style={`background-color: ${currentColor()}`}></div>);
                return;
            }
            if (!targetSwatch) return;
            const color = targetSwatch.style.backgroundColor;
            if (!color.startsWith('oklab')) return;
            const first = color.indexOf(' ');
            const second = color.indexOf(' ', first +1);
            const third = color.indexOf(' ', second +1);
            const fourth = color.indexOf('/', third +1);
            l.set(color.slice(6, first).trim() * 100);
            a.set(color.slice(first, second).trim() * 250);
            b.set(color.slice(second, third).trim() * 250);
            A.set(color.slice(fourth +1, -1).trim() * 100);
            updateColor();
        }
    </script>

    <script>
        let currentTool = '';

        const tools = document.getElementsByClassName('tool');
        for (const tool of tools) {
            if (!tool.getAttribute('name')) continue;
            
            const controls = tool.children[1];
            const expandByDefault = controls && controls.classList.contains('expanded');
            if (controls) {
                const expander = controls.children.namedItem('view-controls');
                expander.onclick = () => controls.classList.toggle('expanded');
                if (!expandByDefault) { // if, normally, this should be collapsed, then open automatically when hovered
                    let focusLock = false;
                    let wantsClose = false;
                    expander.onmouseenter = () => controls.classList.add('expanded');
                    tool.onmouseleave = e => {
                        if (focusLock) return wantsClose = true;
                        wantsClose = false;
                        // colorPicker.hidePopover();
                        controls.classList.remove('expanded');
                    }
                    controls.addEventListener('focusin', () => focusLock = true);
                    controls.addEventListener('focusout', e => {
                        if (e.rangeParent.id === 'color-picker') return;
                        focusLock = false;
                        if (wantsClose) {
                            // colorPicker.hidePopover();
                            controls.classList.remove('expanded');
                            wantsClose = false;
                        }
                    });
                }
            }

            const selector = tool.firstElementChild;
            selector.onclick = () => {
                for (const tool of tools) {
                    if (!tool.getAttribute('name')) continue;
                    tool.classList.remove('selected');
                }
                tool.classList.add('selected');
                if (expandByDefault)
                    controls.classList.add('expanded');
                currentTool = tool.getAttribute('name');
                zoomViewer.hidden = true;
            }

            if (tool.classList.contains('selected'))
                currentTool = tool.getAttribute('name');
        }

        const fullscreen = document.getElementById('fullscreen');
        (fullscreen.onclick = async () => {
            if (document.fullscreenElement)  
                await document.exitFullscreen();
            else
                await document.body.requestFullscreen();
            fullscreen.firstElementChild.src = document.fullscreenElement
                ? '/google-material/halfscreen.svg'
                : '/google-material/fullscreen.svg';
        })();
        const save = document.getElementById('save');
        save.onclick = async () => {
            const zip = new JSZip();
            const promises = [];
            for (let i = 0; i < layers.length; i++)
                promises.push(new Promise(r => 
                    layers[i].toBlob(blob => r(zip.file(`${i}.png`, blob))))
                );
            await Promise.all(promises);

            const data = await zip.generateAsync({
                type: 'blob', 
                mimeType: 'application/gsa-paint-file',
                compression: 'DEFLATE',
                compressionOptions: { level: 9 }
            });
            const url = URL.createObjectURL(data);
            download.href = url; download.download = imageName.value + '.pif';
            download.click();
            URL.revokeObjectURL(url);
        }
        const makeImage = document.getElementById('export');
        makeImage.onclick = async () => {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            for (const layer of layers)
                ctx.drawImage(layer, 0,0);
            canvas.toBlob(data => {
                const url = URL.createObjectURL(data);
                download.href = url; download.download = imageName.value;
                download.click();
                URL.revokeObjectURL(url);
            });
        }
        const load = document.getElementById('load');
        load.onclick = async () => importFile.click();
        const importFile = document.getElementById('import');
        importFile.onchange = () => {
            const file = importFile.files[0];
            imageName.value = file.name.split('.').slice(0, -1).join('.');
            const image = new Image();
            image.onload = () => {
                layers.forEach(layer => layer.remove());
                layers.splice(0, layers.length);
                currentLayer = 0;

                const canvas = document.createElement('canvas');
                layerContainer.appendChild(canvas);
                layers.push(canvas);
                resize(image.width, image.height);
                const ctx = canvas.getContext('2d');

                ctx.drawImage(image, 0,0);
            }
            image.src = URL.createObjectURL(file);
        }
        const copy = document.getElementById('copy');
        copy.onclick = () => {
            /** @type {CanvasRenderingContext2D} */
            const ctx = layers[currentLayer].getContext('2d');
            otx.clearRect(0,0, overlay.width, overlay.height);
            const data = ctx.getImageData(startX, startY, selectWidth, selectHeight);
            clip = data;
        }
        const cut = document.getElementById('cut');
        cut.onclick = () => {
            /** @type {CanvasRenderingContext2D} */
            const ctx = layers[currentLayer].getContext('2d');
            otx.clearRect(0,0, overlay.width, overlay.height);
            const data = ctx.getImageData(startX, startY, selectWidth, selectHeight);
            ctx.clearRect(startX, startY, selectWidth, selectHeight);
            clip = data;
        }
        const paste = document.getElementById('paste');
        paste.onclick = () => currentTool = 'paste';
        const delet = document.getElementById('delete');
        delet.onclick = () => {
            /** @type {CanvasRenderingContext2D} */
            const ctx = layers[currentLayer].getContext('2d');
            otx.clearRect(0,0, overlay.width, overlay.height);
            ctx.clearRect(startX, startY, selectWidth, selectHeight);
        }
        const imageName = document.getElementById('image-name');
        const download = document.getElementById('download');
        const toucher = document.getElementById('toucher');
        const overlay = document.getElementById('overlay');
        const layerContainer = document.getElementById('layers');
        const layers = [...layerContainer.children];
        window.devicePixelRatio ||= 1;
        let width = window.innerWidth;
        let height = window.innerHeight;
        let currentLayer = 0;
        const zoomViewer = document.getElementById('zoom-viewer');
        function resize(w,h, xAlign = 'center', yAlign = 'center') {
            width = overlay.width = w;
            height = overlay.height = h;
            for (const layer of layers) {
                const ctx = layer.getContext('2d');
                const data = ctx.getImageData(0,0, layer.width, layer.height);
                layer.width = w;
                layer.height = h;

                let x = 0;
                let y = 0;
                switch (xAlign) {
                case 'right': x = layer.width - data.width; break;
                case 'center': x = (layer.width - data.width) / 2; break;
                }
                switch (yAlign) {
                case 'right': y = layer.height - data.height; break;
                case 'center': y = (layer.height - data.height) / 2; break;
                }
                ctx.putImageData(data, x,y);
            }
        }
        resize(width, height);
        /** @type {CanvasRenderingContext2D} */
        const otx = overlay.getContext('2d');
        /** @type {CanvasRenderingContext2D} */
        const ztx = zoomViewer.firstElementChild.getContext('2d');
        let backgroundPattern = 'transparent';
        const backgroundImage = new Image();
        backgroundImage.src = '/background-pattern.png';

        let panX = 0; 
        let panY = 0;
        let zoom = 1;
        function draw() {
            layerContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
            overlay.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;

            requestAnimationFrame(draw);
        }; draw();

        let clip = null;
        let startX = 0;
        let startY = 0;
        let selectWidth = 0;
        let selectHeight = 0;
        let lastX = 0;
        let lastY = 0;
        let lastAbsX = 0;
        let lastAbsY = 0;
        let path = new Path2D();
        let penIdent = -1;
        let firstFinger = -1;
        let secondFinger = -1;
        let lastCenterX = 0;
        let lastCenterY = 0;
        let lastDistance = 0;
        toucher.ontouchstart = e => {
            e.preventDefault();
            let firstTouch;
            let secondTouch;
            for (const touch of e.touches) {
                if (touch.identifier === firstFinger) { firstTouch = touch; continue; }
                if (touch.identifier === secondFinger) { secondTouch = touch; continue; }
                if (touch.force === 1) {
                    if (firstFinger < 0) {
                        firstFinger = touch.identifier;
                        firstTouch = touch;
                        continue;
                    }
                    if (secondFinger < 0) {
                        secondFinger = touch.identifier;
                        secondTouch = touch;
                        continue;
                    }
                    continue;
                }
                penIdent = touch.identifier;
                toucher.onmousedown(touch);
            }
            
            if (!firstTouch || !secondTouch) return;
            lastCenterX = (firstTouch.clientX + secondTouch.clientX) / 2;
            lastCenterY = (firstTouch.clientY + secondTouch.clientY) / 2;
            const diffX = firstTouch.clientX - secondTouch.clientX;
            const diffY = firstTouch.clientY - secondTouch.clientY;
            lastDistance = Math.sqrt((diffX * diffX) + (diffY * diffY));
        }
        toucher.onmousedown = e => {
            /** @type {CanvasRenderingContext2D} */
            const ctx = layers[currentLayer].getContext('2d');
            const x = Math.floor((((e.clientX - panX) - (layerContainer.clientWidth / 2)) / zoom) + (layerContainer.clientWidth / 2));
            const y = Math.floor((((e.clientY - panY) - (layerContainer.clientHeight / 2)) / zoom) + (layerContainer.clientHeight / 2));

            switch (currentTool) {
            case 'paste':
                ctx.putImageData(clip, x,y);
                otx.clearRect(0,0, overlay.width, overlay.height);
                break;
            case 'pan':
                lastAbsX = e.clientX;
                lastAbsY = e.clientY;
                break;
            case 'select':
                startX = x;
                startY = y;
                selectWidth = 0;
                selectHeight = 0;
                otx.clearRect(0,0, overlay.width, overlay.height);
                break;
            case 'pencil':
                ctx.strokeStyle = document.getElementById('pencil-stroke').firstElementChild.style.backgroundColor;
                otx.fillStyle = document.getElementById('pencil-fill').firstElementChild.style.backgroundColor;
                ctx.lineWidth = document.getElementById('pencil-size').value * (e.force ?? 1);
                ctx.lineCap = 'round';
                otx.clearRect(0,0, overlay.width, overlay.height);
                path.moveTo(x,y);
                ctx.beginPath();
                ctx.moveTo(x,y);
                ctx.lineTo(x,y +1);
                ctx.stroke();
                otx.fill(path);
                break;
            case 'pen': 
                ctx.strokeStyle = document.getElementById('pen-stroke').firstElementChild.style.backgroundColor;
                ctx.fillStyle = document.getElementById('pen-fill').firstElementChild.style.backgroundColor;
                ctx.lineWidth = document.getElementById('pen-size').value;
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                path.moveTo(x,y);
                path.lineTo(x,y +1);
                ctx.stroke(path);
                ctx.fill(path);
                break;
            case 'erase':
                otx.lineWidth = document.getElementById('eraser-size').value;
                otx.strokeStyle = otx.createPattern(backgroundImage, 'repeat');
                otx.lineJoin = 'round';
                otx.lineCap = 'round';
                otx.clearRect(0,0, overlay.width, overlay.height);
                path.moveTo(x,y);
                break;
            }
            lastX = x;
            lastY = y;
        }
        toucher.ontouchmove = e => {
            e.preventDefault();
            let firstTouch;
            let secondTouch;
            for (const touch of e.touches) {
                if (touch.identifier === firstFinger) { firstTouch = touch; continue; }
                if (touch.identifier === secondFinger) { secondTouch = touch; continue; }
                if (touch.identifier !== penIdent) continue;
                toucher.onmousemove(touch);
            }
            
            if (!firstTouch || !secondTouch) return;
            const centerX = (firstTouch.clientX + secondTouch.clientX) / 2;
            const centerY = (firstTouch.clientY + secondTouch.clientY) / 2;
            const diffX = firstTouch.clientX - secondTouch.clientX;
            const diffY = firstTouch.clientY - secondTouch.clientY;
            const distance = Math.sqrt((diffX * diffX) + (diffY * diffY));
            const speedX = centerX - lastCenterX;
            const speedY = centerY - lastCenterY;
            zoom += (distance - lastDistance) / 100;
            panX += speedX;
            panY += speedY;
            lastCenterX = centerX;
            lastCenterY = centerY;
            lastDistance = distance;
        }

        toucher.onmousemove = e => {
            /** @type {CanvasRenderingContext2D} */
            const ctx = layers[currentLayer].getContext('2d');
            const x = Math.floor((((e.clientX - panX) - (layerContainer.clientWidth / 2)) / zoom) + (layerContainer.clientWidth / 2));
            const y = Math.floor((((e.clientY - panY) - (layerContainer.clientHeight / 2)) / zoom) + (layerContainer.clientHeight / 2));

            switch (currentTool) {
            case 'paste':
                otx.clearRect(0,0, overlay.width, overlay.height);
                otx.putImageData(clip, x,y);
                break;
            case 'color-picker':
                otx.clearRect(0,0, overlay.width, overlay.height);
                const width = zoomViewer.firstElementChild.width;
                const height = zoomViewer.firstElementChild.height;
                const data = ctx.getImageData(x -Math.ceil(width / 2), y -Math.ceil(height / 2), width, height);
                ztx.putImageData(data, 0,0);
                ztx.globalCompositeOperation = 'destination-over';
                for (let ox = 0; ox < width / backgroundImage.width; ox++)
                    for (let oy = 0; oy < height / backgroundImage.height; oy++)
                        ztx.drawImage(backgroundImage, (ox * backgroundImage.width) + ((x % 2) -1), (oy * backgroundImage.height) + ((y % 2) -1));
                const [r,g,b,a] = [...ctx.getImageData(x,y, 1,1).data].map(v => (v / 255) * 100);
                console.log(r,g,b,a);
                zoomViewer.style.borderColor = `rgba(${r}%, ${g}%, ${b}%, ${a}%)`;
                zoomViewer.style.left = `${e.clientX}px`;
                zoomViewer.style.top = `${e.clientY}px`;
                break;
            case 'pan':
                if ('buttons' in e && !(e.buttons & 1)) return;
                panX += e.clientX - lastAbsX;
                panY += e.clientY - lastAbsY;
                lastAbsX = e.clientX;
                lastAbsY = e.clientY;
                break;
            case 'select':
                if ('buttons' in e && !(e.buttons & 1)) return;
                otx.clearRect(0,0, overlay.width, overlay.height);
                otx.fillStyle = '#03B6FC1F';
                otx.setLineDash([4,4]);
                otx.strokeStyle = 'grey';
                otx.lineWidth = 1;
                selectWidth = x - startX;
                selectHeight = y - startY;
                otx.fillRect(startX, startY, selectWidth, selectHeight);
                otx.strokeRect(startX +.5, startY +.5, selectWidth -1, selectHeight -1);
                break;
            case 'pencil':
                if ('buttons' in e && !(e.buttons & 1)) return;
                otx.clearRect(0,0, overlay.width, overlay.height);
                ctx.lineWidth = document.getElementById('pencil-size').value * (e.force ?? 1);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x,y);
                path.lineTo(x,y);
                ctx.stroke();
                otx.fill(path);
                break;
            case 'pen':
                if ('buttons' in e && !(e.buttons & 1)) return;
                path.lineTo(x,y);
                ctx.stroke(path);
                ctx.fill(path);
                break;
            case 'erase':
                if ('buttons' in e && !(e.buttons & 1)) return;
                otx.clearRect(0,0, overlay.width, overlay.height);
                path.lineTo(x,y);
                otx.stroke(path);
                break;
            }
            lastX = x;
            lastY = y;
        }
        toucher.ontouchend = e => {
            e.preventDefault();
            for (const touch of e.changedTouches) {
                if (touch.identifier === firstFinger) { firstFinger = -1; continue; }
                if (touch.identifier === secondFinger) { secondFinger = -1; continue; }
                if (touch.identifier !== penIdent) continue;
                penIdent = -1;
                toucher.onmouseup(touch);
            }
        }
        toucher.onmouseup = e => {
            /** @type {CanvasRenderingContext2D} */
            const ctx = layers[currentLayer].getContext('2d');
            const x = Math.floor((((e.clientX - panX) - (layerContainer.clientWidth / 2)) / zoom) + (layerContainer.clientWidth / 2));
            const y = Math.floor((((e.clientY - panY) - (layerContainer.clientHeight / 2)) / zoom) + (layerContainer.clientHeight / 2));

            switch (currentTool) {
            case 'color-picker': 
                currentTool = document.querySelector('.tool.selected').getAttribute('name');
                zoomViewer.hidden = true;
                // stolen from https://gist.github.com/earthbound19/e7fe15fdf8ca3ef814750a61bc75b5ce#file-oklabexperiments-js-L60
                const [r,g,B,A] = [...ctx.getImageData(x,y, 1,1).data]
                    .map(v => v / 255)
                    .map((c,i) => i < 3 ? (c >= 0.04045 ? Math.pow((c + 0.055) / 1.055, 2.4) : c / 12.92) : c);
                const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * B);
                const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * B);
                const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * B);
                const L = l * +0.2104542553 + m * +0.7936177850 + s * -0.0040720468;
                const a = l * +1.9779984951 + m * -2.4285922050 + s * +0.4505937099;
                const b = l * +0.0259040371 + m * +0.7827717662 + s * -0.8086757660;
                targetSwatch.style.backgroundColor = `oklab(${L} ${a} ${b} / ${A})`;
                colorPicker.showPopover({ source: targetSwatch.parentElement });
                break;
            case 'paste':
                currentTool = 'select';
                otx.clearRect(0,0, overlay.width, overlay.height);
                ctx.putImageData(clip, x,y);
                break;
            case 'pencil': 
                otx.clearRect(0,0, overlay.width, overlay.height);
                ctx.strokeStyle = document.getElementById('pencil-stroke').firstElementChild.style.backgroundColor;
                ctx.fillStyle = document.getElementById('pencil-fill').firstElementChild.style.backgroundColor;
                ctx.lineWidth = document.getElementById('pencil-size').value * (e.force ?? 1);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x,y);
                path.lineTo(x,y);
                ctx.stroke();
                ctx.fill(path);
                path = new Path2D();
                break;
            case 'pen': path = new Path2D(); break;
            case 'erase':
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = document.getElementById('eraser-size').value;
                ctx.strokeStyle = otx.createPattern(backgroundImage, 'repeat');
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                otx.clearRect(0,0, overlay.width, overlay.height);
                path.lineTo(x,y);
                ctx.stroke(path);
                ctx.globalCompositeOperation = 'source-over';
                path = new Path2D();
                break;
            }
            lastX = x;
            lastY = y;
        }
        toucher.onwheel = e => {
            e.preventDefault();
            let value = e.deltaY;
            switch (e.deltaMode) {
            case 0: break;
            case 2:
            case 1: console.warn('Bad firefox, BAD'); break;
            }
            zoom += e.deltaY / 100;
            console.log(e);
        }
        // canvas.ontouchcancel = e => {
        //     e.preventDefault();
        // }
    </script>
</body>
</html>
