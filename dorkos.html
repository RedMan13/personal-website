<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dork OS</title>
    <meta name="description" content="The one and only os designed for Dorkings!!!">
    <meta name="keywords" content="chicken,os,webos,dorking,dorkings,">
    <script>
        const authorized = !!performance.getEntriesByType('navigation')[0].serverTiming.find(v => v.name === 'authorized');

        const elementClassNames = {
            "a": 'HTMLAnchorElement',
            "area": 'HTMLAreaElement',
            "audio": 'HTMLAudioElement',
            "base": 'HTMLBaseElement',
            "blockquote": 'HTMLQuoteElement',
            "body": 'HTMLBodyElement',
            "br": 'HTMLBRElement',
            "button": 'HTMLButtonElement',
            "canvas": 'HTMLCanvasElement',
            "caption": 'HTMLTableCaptionElement',
            "col": 'HTMLTableColElement',
            "colgroup": 'HTMLTableColElement',
            "data": 'HTMLDataElement',
            "datalist": 'HTMLDataListElement',
            "del": 'HTMLModElement',
            "details": 'HTMLDetailsElement',
            "dialog": 'HTMLDialogElement',
            "dir": 'HTMLDirectoryElement',
            "div": 'HTMLDivElement',
            "dl": 'HTMLDListElement',
            "embed": 'HTMLEmbedElement',
            "fencedframe": 'HTMLUnknownElement',
            "fieldset": 'HTMLFieldSetElement',
            "font": 'HTMLFontElement',
            "form": 'HTMLFormElement',
            "frame": 'HTMLFrameElement',
            "frameset": 'HTMLFrameSetElement',
            "h1": 'HTMLHeadingElement',
            "head": 'HTMLHeadElement',
            "hr": 'HTMLHRElement',
            "html": 'HTMLHtmlElement',
            "iframe": 'HTMLIFrameElement',
            "img": 'HTMLImageElement',
            "input": 'HTMLInputElement',
            "ins": 'HTMLModElement',
            "label": 'HTMLLabelElement',
            "legend": 'HTMLLegendElement',
            "li": 'HTMLLIElement',
            "link": 'HTMLLinkElement',
            "map": 'HTMLMapElement',
            "marquee": 'HTMLMarqueeElement',
            "menu": 'HTMLMenuElement',
            "meta": 'HTMLMetaElement',
            "meter": 'HTMLMeterElement',
            "object": 'HTMLObjectElement',
            "ol": 'HTMLOListElement',
            "optgroup": 'HTMLOptGroupElement',
            "option": 'HTMLOptionElement',
            "output": 'HTMLOutputElement',
            "p": 'HTMLParagraphElement',
            "param": 'HTMLParamElement',
            "picture": 'HTMLPictureElement',
            "portal": 'HTMLUnknownElement',
            "pre": 'HTMLPreElement',
            "progress": 'HTMLProgressElement',
            "q": 'HTMLQuoteElement',
            "script": 'HTMLScriptElement',
            "select": 'HTMLSelectElement',
            "slot": 'HTMLSlotElement',
            "source": 'HTMLSourceElement',
            "span": 'HTMLSpanElement',
            "style": 'HTMLStyleElement',
            "table": 'HTMLTableElement',
            "tbody": 'HTMLTableSectionElement',
            "td": 'HTMLTableCellElement',
            "template": 'HTMLTemplateElement',
            "textarea": 'HTMLTextAreaElement',
            "tfoot": 'HTMLTableSectionElement',
            "th": 'HTMLTableCellElement',
            "thead": 'HTMLTableSectionElement',
            "time": 'HTMLTimeElement',
            "title": 'HTMLTitleElement',
            "tr": 'HTMLTableRowElement',
            "track": 'HTMLTrackElement',
            "ul": 'HTMLUListElement',
            "video": 'HTMLVideoElement',
            "xmp": 'HTMLPreElement'
        };
        // loose def for elements that dont require any direct manipulation
        function defineElement(name, attributes, innerGen) {
            const extend = attributes.extends;
            /** @type {HTMLElement} */
            const elClass = window[elementClassNames[extend]] ?? HTMLElement;
            let onAttributes;
            class newElement extends elClass {
                static observedAttributes = Object.keys(attributes)
                    .filter(key => !key.startsWith('on') && !['extends', 'attributes'].includes(key));
                display = null;
                priv = {};
                constructor() {
                    if (extend) 
                        return document.createElement(extend, { is: name });
                    super();
                    this.render();
                    for (const [key, val] of Object.entries(attributes)) {
                        if (key.startsWith('on')) {
                            this.addEventListener(key.slice(2), val.bind(this));
                            continue;
                        }
                        this.setAttribute(key, val);
                    }
                }
                render() {
                    if (!this.display) this.display = this.attachShadow({ mode: 'open' });
                    this.display.innerHTML = '';
                    innerGen.apply(this, [this.display]);
                }
                attributeChangedCallback(key, oldVal, newVal) {
                    if (oldVal === newVal) return;
                    if (key in newElement.prototype) this[key] = newVal;
                    onAttributes?.apply?.(this, [key, newVal, oldVal]);
                }
            }
            for (const key in attributes) {
                if (key.startsWith('on')) {
                    switch (key.slice(3)) {
                    case 'connected':
                        newElement.prototype.connectedCallback = attributes[key];
                        delete attributes[key];
                        break;
                    case 'disconnected':
                        newElement.prototype.disconnectedCallback = attributes[key];
                        delete attributes[key];
                        break;
                    case 'adopted':
                        newElement.prototype.adoptedCallback = attributes[key];
                        delete attributes[key];
                        break;
                    case 'attributes':
                        onAttributes = attributes[key];
                        delete attributes[key];
                        break;
                    }
                    continue;
                }
            }
            if (attributes.attributes) {
                newElement.observedAttributes = attributes.attributes;
                delete attributes.attributes;
            }
            if (attributes.this) {
                Object.assign(newElement.prototype, attributes.this);
                delete attributes.this;
            }
            delete attributes.extends;
            customElements.define(name, newElement, { extends: attributes.extends });
            return newElement;
        }
        function appendChildren(parent, children) {
            children.forEach(child => {
                if (!child) return;
                if (Array.isArray(child))
                    return appendChildren(parent, child);

                try { parent.appendChild(child); }
                catch (e) {
                    parent.appendChild(document.createTextNode(String(child)));
                }
            });
        }
        /** @param {HTMLElement} el */
        function setAttribute(el, key, val) {
            if (val) el.setAttribute(key, typeof val === 'object' ? JSON.stringify(val) : val);
            else el.removeAttribute(key);
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');

        html, body {
            font-family: "Open Sans";
            padding: 0px;
            margin: 0px;
            height: 100%;
        }
        .fullscreen {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .background {
            pointer-events: none;
            user-select: none;
            object-fit: fill;
            z-index: -1;
        }
        .logon-ui {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .desktop, .logon-ui {
            transition: opacity 150ms ease-out;
            opacity: 1;
        }
        .hidden {
            opacity: 0;
        }
    </style>
    <script src="/jszip.min.js"></script>
    <script>
        // setup defaults
        if (!localStorage.hasSetup) {
            localStorage.setItem('login-backdrop', 'joeback.svg');
            localStorage.setItem('accounts', 1);
            localStorage.setItem('account0-name', 'PuzzlingGGG');
            localStorage.setItem('account0-password', 'joemama');
            localStorage.setItem('account0-icon', 'puzzlingggg.jpg');
            localStorage.setItem('account0-backdrop', 'joeback.svg');
        }
        // setup fs
        const fs = new JSZip();
        let savable = false;
        try {
            /** @type {IDBDatabase} */
            let db;
            const req = indexedDB.open('filesystem', 3);
            req.onblocked = req.onerror = e => console.error(e);
            req.onupgradeneeded = e => {
                db = req.result;
                db.deleteObjectStore('filesystem');
                const object = db.createObjectStore('filesystem', { keyPath: 'unique' });
                object.createIndex('zip-file', 'zipFile', { unique: false });
            }
            function read(object, key) {
                return new Promise((resolve, reject) => {
                    const store = db.transaction('filesystem', 'readonly').objectStore(object);
                    const req = store.get(key);
                    req.onsuccess = () => resolve(req.result?.zipFile);
                    req.onerror = () => reject(req.error);
                })
            }
            function write(object, key, value) {
                return new Promise((resolve, reject) => {
                    const store = db.transaction('filesystem', 'readwrite').objectStore(object);
                    const req = store.put({ unique: key, zipFile: value });
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                })
            }
            req.onsuccess = async e => {
                savable = true;
                db = req.result;
                const zipFile = await read('filesystem', 'main-zip');
                if (zipFile) await fs.loadAsync(zipFile, { createFolders: true });

                if (!fs.folder(/^Desktop\//).length) {
                    fs.folder('Desktop');
                    fs.folder('Downloads');
                    fs.folder('Documents');
                    fs.folder('Images');
                    fs.folder('Sounds');
                    fs.folder('Videos');
                    fs.file('Dekstop/Welcome.txt', 'Welcome to DorkOS! To setup your account, open settings>account and select this account. To add more accounts, go to settings>account and press "+ add account"', { comment: '?X=0&Y=0' });

                }
                const onWriteTime = async () => write('filesystem', 'main-zip', await fs.generateAsync({
                    type: 'uint8array',
                    compression: 'DEFLATE',
                    compressionOptions: { level: 9 }
                }));
                await onWriteTime();
                setInterval(onWriteTime, 30000)
            }
        } catch (err) {
            console.error(err);
        }
    </script>
</head>
<body>
    <div id="main-screen" class="fullscreen desktop hidden">
        <img src="joeback.svg" class="fullscreen background">
    </div>
    <div id="login-ui" class="fullscreen logon-ui">
        <img id="login-backdrop" class="fullscreen background" style="filter: blur(1.5rem);">
    </div>
    
    <script file="jsx">
        const AccountTile = <define
            this={{ icon: null, name: '', password: '', selected: false, idx: -1 }}
            icon name="" password
            on:attributes={function(key, value) { this.render() }}
        >
            <style>{`
                .account {
                    font-family: "Open Sans";
                    text-align: center;
                    border-radius: .75rem;
                    padding: 1rem;
                    border: 1px solid #FFF0;
                    transition: all 150ms ease-out;
                    box-shadow: 0px 0px 5px black;
                    margin: 5px;
                    user-select: none;
                    overflow: hidden;
                    width: 6rem;
                    height: 8.5rem;
                }
                .account:hover {
                    transition: all 150ms ease-in;
                    border: 1px solid #FFF8;
                    background-color: #FFF6;
                    box-shadow: 0px 0px 20px black;
                    margin-bottom: .5rem;
                }
                .icon {
                    pointer-events: none;
                    border-radius: 100%;
                    aspect-ratio: 1 / 1;
                    width: 6rem;
                }
                .label {
                    max-width: 100%;
                    margin-bottom: 0;
                    overflow: hidden;
                    text-overflow: ellipsis;
                }

                .password {
                    width: 100%;
                    position: relative;
                    box-sizing: border-box;
                    background-color: #FFF6;
                    border: 1px solid #FFF0;
                    border-radius: 1rem;
                    margin-top: .5rem;
                    padding: .5rem;
                    text-align: center;
                }
                .password-fields { display: none }
                .selected .password-fields {
                    display: block;
                    width: 100%;
                }
                .selected {
                    margin: 1rem;
                    height: 11rem;
                }
            `}</style>
            <div
                on:click={e => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
                    for (const tile of document.getElementsByTagName('account-tile')) {
                        tile.selected = tile === this;
                        tile.render();
                    }
                }}
                class={"account" + (this.selected ? ' selected' : '')}
            >
                <img src={this.icon} class="icon"></img>
                <p class="label">{this.name}</p>
                <div class="password-fields">
                    <input
                        class="password"
                        type="password"
                        placeholder="Password"
                        on:keydown={e => {
                            /** @type {HTMLInputElement} */
                            const self = e.target;
                            if (e.key !== 'Enter') return;
                            if (self.value !== this.password) {
                                self.animate(
                                    [
                                        {
                                            // from
                                            backgroundColor: "#F116",
                                            left: 0,
                                            easing: "ease-in"
                                        },
                                        {
                                            offset: 0.1,
                                            left: '.5rem',
                                            easing: "ease-in"
                                        },
                                        {
                                            offset: 0.2,
                                            left: '-.45rem',
                                            easing: "ease-in"
                                        },
                                        {
                                            offset: 0.3,
                                            left: '.4rem',
                                            easing: "ease-in"
                                        },
                                        {
                                            offset: 0.4,
                                            left: '-.35rem',
                                            easing: "ease-in"
                                        },
                                        {
                                            offset: 0.5,
                                            left: '.3rem',
                                            easing: "ease-in"
                                        },
                                        {
                                            offset: 0.6,
                                            left: '-.25rem',
                                            easing: "ease-in"
                                        },
                                        {
                                            offset: 0.7,
                                            left: '.2rem',
                                            easing: "ease-in"
                                        },
                                        {
                                            offset: 0.8,
                                            left: '-.15rem',
                                            easing: "ease-in"
                                        },
                                        {
                                            offset: 0.9,
                                            left: '.1rem',
                                            easing: "ease-in"
                                        },
                                        {
                                            // to
                                            backgroundColor: "#FFF6",
                                            left: 0
                                        }
                                    ],
                                    750
                                );
                                return;
                            }
                            mainScreen.classList.remove('hidden');
                            loginUi.classList.add('hidden');
                            setTimeout(() => loginUi.style.display = 'none', 150);
                            loggedInto = this.idx;
                        }}
                    />
                </div>
            </div>
        </define>;
        const WindowBorder = <define
            x y width height title="Application" icon=""
        >
            <style>{`
                
                .window {
                    border: 1px solid grey;
                    display: grid;
                    grid-template-columns: 1fr 2rem 2rem 2rem;
                    grid-template-rows: 1rem 1fr;
                    position: absolute;

        width: 400px;
        height: 300px;
        left: 200px;
        top: 200px;
                }
                .top-background {
                    grid-column: 1 / 5;
                    grid-row: 1;
                    background: #E3E3E3;
                }
                .title {
                    grid-column: 1;
                    grid-row: 1;
                }
                
                .title-button {
                    grid-row: 1;
                    text-align: center;
                    border-left: 1px solid #1C1C1C;
                }
                .title-button img { height: 100%; }
                .title-button:hover { filter: saturate(80%); }
                .minimize {
                    grid-column: 2;
                }
                .maximize {
                    grid-column: 3;
                }
                .maximize .maximised {}
                .close {
                    grid-column: 4;
                }

                .content {
                    grid-column: 1 / 5;
                    grid-row: 3;
                    background-color: white;
                }
            `}</style>
            <div class="window">
                <div class="top-background"></div>
                <div class="title"></div>
                <div class="title-button minimize"><img src="/google-material/minimize.svg"/></div>
                <div class="title-button maximize"><img src="/google-material/maximize.svg"/></div>
                <div class="title-button close"><img src="/google-material/close.svg"/></div>
                <div class="content"></div>
            </div>
        </define>

        let loggedInto = -1;
        const loginUi = document.getElementById('login-ui');
        const mainScreen = document.getElementById('main-screen');
        const loginBackdrop = document.getElementById('login-backdrop');
        loginBackdrop.src = localStorage.getItem('login-backdrop');

        for (let i = 0; i < localStorage.accounts; i++) {
            const account = new AccountTile();
            account.setAttribute('idx', i);
            account.setAttribute('name', localStorage.getItem(`account${i}-name`));
            account.setAttribute('icon', localStorage.getItem(`account${i}-icon`));
            account.setAttribute('password', localStorage.getItem(`account${i}-password`));
            loginUi.appendChild(account);
        }

        const testWindow = new WindowBorder();
        mainScreen.appendChild(testWindow);
    </script>
</body>
</html>
