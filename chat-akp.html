<!TEMPLATE /cardpage.html>
<head>
    <title>ChatAKP</title>

    <script src="/marked.min.js"></script>
    <script src="/footnotes.min.js"></script>
    <style>
        #main {
            height: 100%;
            display: grid;
            gap: .2em;
            grid-template-rows: 1fr max-content;
            padding: 0 .2em .2em .05em;
            box-sizing: border-box;
        }
        .chat-controls {
            position: absolute;
            right: 0;
            top: 0;
        }
        .message-wrapper {
            position: relative;
            display: flex;
            flex-direction: column-reverse;

            box-sizing: border-box;
            box-shadow: inset 0px 0px 4px grey;
            border-radius: 10px;
            padding: 5px;
            overflow: scroll;
        }
        .message-content {
            box-sizing: border-box;
            width: 100%;
            display: grid;
            grid-template-rows: max-content max-content;
            grid-template-columns: 1fr max-content max-content max-content max-content;
            gap: .1em;
        }
        .text-box {
            max-height: 10em;
            font-size: .85em;
            padding: .05em .11em;
            border: .05em solid grey;
            border-radius: .11em;
        }
        .text-box:empty::before {
            content: 'Message the chatbot (ctrl + enter to send)';
            width: 0;
            color: grey;
            display: inline-block;
            white-space: nowrap;
        }
        .message-replying {
            grid-column: 1 / 4;
            text-align: right;
        }
        .input-button { padding: 0; }
        .input-button img {
            height: 1.4em;
            display: block;
        }

        .load-more { margin-bottom: .85em; }

        .cover-all {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #00000044;

            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loader {
            position: absolute;
            overflow: hidden;
            bottom: 50%;
            border-bottom: .1em solid black;
            animation: loading-line 3s infinite ease-in-out;
        }
        @keyframes loading-line {
            0% {
                left: 0;
                width: 2em;
                height: 0;
            }
            50% {
                left: calc(50% - 2.5em);
                width: 5em;
                height: 2em;
            }
            100% {
                left: 100%;
                width: 2em;
                height: 0;
            }
        }
        @keyframes slide-in {
            from {
                left: -100%;
            }
            to {
                left: 0;
            }
        }
        .el-evil-error-banner {
            position: absolute;
            display: inline-block;
            width: 480px;
            background-color: black;
            color: white;
            text-align: center;
            animation: slide-in 1s 1 ease-out;
        }
    </style>
</head>
<body>
    <div id="messages" class="message-wrapper">
        <button id="load-more" class="load-more">Load More</button>
    </div>
    <div class="message-content">
        <a class="message-replying" hidden id="replying-text">Replying to a message</a>
        <button id="cancel-reply" hidden class="input-button">
            <img src="/google-material/x-by-y.svg" title="Cancel reply">
        </button>

        <div id="content" class="text-box" contenteditable></div>
        <div><button id="send" class="input-button">
            <img src="/google-material/send-message.svg" title="Send message">
        </button></div>
        <div><button id="delete" class="input-button">
            <img src="/google-material/delete.svg" title="Delete chat">
        </button></div>
        <div><button id="block" hidden class="input-button">
            <img src="/google-material/block-from-chatting.svg" title="Block user">
        </button></div>
        <div><button id="leave" class="input-button">
            <img src="/google-material/exit-chat.svg" title="Leave chat">
        </button></div>
    </div>
    <div class="cover-all" id="alerts-loading">
        <div class="loader">Loading...</div>
    </div>
    <script file="jsx">
        const SingleMessage = <define
            self={false}
            content=""
            timestamp=""
            reference=""
            message=""
            on:attributes={function () { this.redraw() }}
        >
            <style>{`
                .message {
                    justify-self: left;
                    text-align: left;
                    display: flex;
                    flex-direction: column;
                    align-items: left;
                    margin-bottom: .85em;
                    cursor: url('/google-material/exit-chat.svg'), auto
                }
                .message.self {
                    justify-self: right;
                    text-align: right;
                    align-items: right;
                }

                .content {
                    display: flex;
                    flex-direction: column;
                    align-items: start;
                }
                .content * {
                    cursor: text;
                    width: max-content;
                }
                p { margin: .2em; }
                .self .content { align-items: end; }

                .reference {
                    font-size: 0.75em;
                    white-space: nowrap;
                    text-overflow: ellipsis;
                    max-width: 50%;
                }
                .reference div {
                    height: .5em;
                    width: 2em;
                    border-top-left-radius: 1em;
                    border-top: 1px solid grey;
                    margin-top: .5em;
                    float: left;
                }
                .self .reference div {
                    border-top-left-radius: 0;
                    border-top-right-radius: 1em;
                    float: right;
                }

                .timestamp {
                    font-size: 0.75em;
                }

                .message:hover .input-button { display: inline; }
                .input-button {
                    display: none;
                    padding: 0;
                    font-size: .85em;
                    vertical-align: bottom;
                    margin-right: .1em;
                    margin-left: .1em;
                }
                .input-button img {
                    height: 1em;
                    display: block;
                }
            `}</style>
            <div
                class={`message ${this.self && 'self'}`}
                on:click={e => {
                    if (this.contentDiv?.contains?.(e.target) && e.target !== this.contentDiv) return;
                    replyingText.hidden = false;
                    cancelReply.hidden = false;
                    repliedMessage = this.message;
                }}
            >
                {this.reference && 
                    <a class="reference" on:click={() => {
                        const el = document.getElementById(this.reference);
                        el.scrollIntoView();
                    }}>
                        {contentIds[this.reference] ?? '<Not loaded>'}
                        <div/>
                    </a>}
                {(() => {
                    const content = <div class="content"/>;
                    content.innerHTML = marked
                        .use(markedFootnote())
                        .parse(this.content);
                    this.contentDiv = content;
                    
                    return content;
                })()}
                <span class="timestamp">Sent {(() => {
                    const time = new Date(this.timestamp);
                    const delta = (Date.now() - time.getTime());
                    if (delta > (24 * 60 * 60 * 1000))
                        return time.toLocaleString();
                    if (delta > (60 * 60 * 1000))
                        return time.toLocaleTimeString();
                    if (delta < (60 * 1000))
                        return 'now';
                    return `${Math.floor((delta / 60 / 1000) % 60)} minutes ago`;
                })()}</span>
            </div>
        </define>;
        const TargetEntry = <define target="" on:attributes={function () { this.redraw() }}>
            <button
                on:click={() => socket.send(JSON.stringify({ t: 'select', selected: this.target }))}
                style="font-size: 1em; width: 100%; text-align: center;"
            >
                {this.target}
            </button>
        </define>

        const messages = document.getElementById('messages');
        const content = document.getElementById('content');
        const send = document.getElementById('send');
        const loadMore = document.getElementById('load-more');
        const deleteChat = document.getElementById('delete');
        const blockUser = document.getElementById('block');
        const leaveChat = document.getElementById('leave');
        const replyingText = document.getElementById('replying-text');
        const cancelReply = document.getElementById('cancel-reply');
        const alertLoading = document.getElementById('alerts-loading');
        const socket = new WebSocket('/chatbot');
        const contentIds = [];
        let repliedMessage = null;
        let targetSelected = false;
        let targetPage = 0;
        let searchPage = 0;
        let lastMessageId = null;
        let elevated = false;

        socket.onopen = () => alertLoading.style.display = 'none';
        socket.onmessage = e => {
            const packet = JSON.parse(e.data);
            switch (packet.t) {
            case 'unauthorized': open('/sign-in', '_self'); break;
            case 'targets': // first packet is targets, indicating the api expects us to select a target first
                if (location.hash) {
                    socket.send(JSON.stringify({
                        t: 'select',
                        selected: location.hash.slice(1)
                    }));
                    elevated = true;
                    // blockUser.hidden = false;
                    return;
                }
                if (packet.start) {
                    messages.innerHTML = '';
                    messages.appendChild(loadMore);
                    elevated = true;
                    // blockUser.hidden = false;
                }
                loadMore.hidden = packet.final;
                if (packet.targets.length <= 0)
                    messages.innerText = 'No more chats!';
                for (const target of packet.targets)
                    messages.prepend(<TargetEntry target={target}/>);
                break;
            case 'newTarget':
                messages.prepend(<TargetEntry target={packet.target}/>);
                break;
            case 'deleted':
                messages.innerHTML = '';
                alertLoading.style.display = 'inherit';
                alertLoading.innerHTML = '<div class="el-evil-error-banner">Chat deleted.</div>';
                leaveChat.onclick();
                break;
            case 'newMessage':
                contentIds[packet.id] = packet.content;
                messages.prepend(<SingleMessage
                    self={packet.author === userId}
                    reference={packet.reference}
                    content={packet.content}
                    timestamp={packet.setAt}
                    message={packet.id}
                    id={packet.id}
                />);
                break;
            case 'history':
                targetSelected = true;
                lastMessageId = packet.messages.at(-1).id;
                if (packet.start) {
                    messages.innerHTML = '';
                    messages.appendChild(loadMore);
                }
                loadMore.hidden = packet.final;
                if (packet.messages.length <= 0)
                    messages.innerText = 'Send a message to get started.';
                for (const message of packet.messages) {
                    contentIds[message.id] = message.content;
                    messages.prepend(<SingleMessage
                        self={message.author === userId}
                        reference={message.reference}
                        content={message.content}
                        timestamp={message.setAt}
                        message={message.id}
                        id={message.id}
                    />);
                }
                break;
            }
        }
        socket.onclose = () => {
            alertLoading.style.display = 'inherit';
            alertLoading.innerHTML = '<div class="el-evil-error-banner">Connection terminated.</div>';
        }
        setInterval(() => socket.send('{"t":"ping"}'), 4000);

        content.onkeypress = e => {
            if (e.key !== 'Enter' || !e.shiftKey) return;
            e.preventDefault();
            send.onclick();
        }
        send.onclick = () => {
            socket.send(JSON.stringify({
                t: 'send',
                content: content.innerText,
                reference: repliedMessage
            }));

            content.innerText = '';
            repliedMessage = null;
            replyingText.hidden = true;
            cancelReply.hidden = true;
        }
        deleteChat.onclick = () => {
            if (!confirm('Are you sure you want to permanently erase this chat?')) return;
            socket.send(JSON.stringify({ t: 'delete' }));
        }
        blockUser.onclick = () => { socket.send(JSON.stringify({ t: 'block' })); }
        leaveChat.onclick = () => {
            if (!elevated) return window.close();
            socket.send(JSON.stringify({ t: 'select', target: null }));
        }
        loadMore.onclick = () => {
            if (!targetSelected) {
                socket.send(JSON.stringify({ t: 'targets', page: ++targetPage }));
                return;
            }
            socket.send(JSON.stringify({ t: 'nextHistory', id: lastMessageId }));
        }
        cancelReply.onclick = () => {
            repliedMessage = null;
            replyingText.hidden = true;
            cancelReply.hidden = true; 
        }

        // because of the way serv00 works, i dont think this will work, even if i could figure out service workers
        // navigator.serviceWorker.register('/notification-service.js', { scope: location.pathname })
        //     .then(worker => {
        //         worker.active.onerror = console.error;
        //     });
    </script>
</body>
