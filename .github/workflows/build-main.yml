on: [push]

permissions:
  contents: read

concurrency:   
  group: "deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
      - name: Install dependencies and build site
        run: |
          npm i
          echo -e ${{ toJSON(toJSON(github.event.commits)) }} > ./commits.json
          npx build -o ./dist --no-token-debug true --no-node true
          node .push-changes.js '${{ secrets.SSH_PASSWORD }}'
      - name: Dispatch Extensions
        uses: peter-evans/repository-dispatch@v2.0.1
        with:
          token: ${{ secrets.t }}
          event-type: update
          repository: RedMan13/my-extensions
      - name: Dispatch Discordnt
        uses: peter-evans/repository-dispatch@v2.0.1
        with:
          token: ${{ secrets.t }}
          event-type: update
          repository: RedMan13/discordnt
      - name: Dispatch NXTea
        uses: peter-evans/repository-dispatch@v2.0.1
        with:
          token: ${{ secrets.t }}
          event-type: update
          repository: RedMan13/nxtea
