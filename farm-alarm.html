<!DOCTYPE html>
<html>
<head>
    <title>Farm Alarm</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: 'Open Sans', serif;
            font-size: 24px;
        }

        .page-list {
            display: grid;
            width: 100%;
            height: 100%;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr max-content;
        }
        .main-body {
            grid-column: 1 / 4;
            grid-row: 1;
        }
        .selected-tab {
            position: absolute;
            bottom: 0;
            left: 0;
            transition: grid-column 0.25s;
            border-bottom: 2px solid grey;
        }
        .tab-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: .25rem;
            margin: .25rem;
        }
        .tab-button img { width: 1.5rem; }
    </style>
</head>
<body>
    <div class="page-list">
        <div class="main-body"></div>
        <div class="main-body"></div>
        <div class="main-body"></div>

        <div class="selected-tab"><div></div></div>

        <div class="tab-button">
            <img src="/google-material/alarm.svg">
            <span>Alarms</span>
        </div>
        <div class="tab-button">
            <img src="/google-material/location.svg">
            <span>Locations</span>
        </div>
    </div>
    <script>
        const lat = document.getElementById('latitude');
        const long = document.getElementById('longitude');
        const disp = document.getElementById('display');
        /** @type {CanvasRenderingContext2D} */
        const ctx = disp.getContext('2d');
        ctx.arc(50,50, 50, 0, Math.PI *2);
        ctx.stroke();

        const oneDay = 24 * 60 * 60 * 1000;
        const now = new Date();
        const timezone = -now.getTimezoneOffset();

        const link = new URL('https://aa062reffgwvo1efa.api.met.no/weatherapi/sunrise/3.0/sun');
        link.searchParams.set('lat', lat.value)
        link.searchParams.set('lon', long.value);
        link.searchParams.set('date', `${String(now.getFullYear()).padStart(4, '0')}-${String(now.getMonth()).padStart(2, '0')}-${String(now.getDay() +1).padStart(2, '0')}`);
        link.searchParams.set('offset', `${timezone < 0 ? '-' : '+'}${String(Math.floor(Math.abs(timezone / 60))).padStart(2, '0')}:${String(Math.floor(Math.abs(timezone) % 60)).padStart(2, '0')}`)
        fetch(link)
            .then(req => req.json())
            .then(res => {
                const sunriseDate = new Date(res.properties.sunrise.time);
                const sunsetDate = new Date(res.properties.sunset.time)
                const sunrise = (sunriseDate.getTime() % oneDay) / oneDay * Math.PI;
                const sunset = (sunsetDate.getTime() % oneDay) / oneDay * Math.PI;

                console.log(sunriseDate.toLocaleTimeString(), sunsetDate.toLocaleTimeString());

                ctx.beginPath();
                ctx.moveTo(50,50);
                ctx.lineTo((Math.cos(sunrise) * 50) + 50, (Math.sin(sunrise) * 50) + 50);
                ctx.moveTo(50,50);
                ctx.lineTo((Math.cos(sunset) * 50) + 50, (Math.sin(sunset) * 50) + 50);
                ctx.stroke();
            })
    </script>
</body>
</html>
